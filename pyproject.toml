[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mod-platform"
version = "0.3.0"
description = "Local-first decision agent plus a LangGraph HITL / CI-eval artifact"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6.0,<1.1",
    "langsmith>=0.3.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mlx = ["mlx-lm>=0.22"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
