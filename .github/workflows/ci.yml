name: ci

on:
  push:
  pull_request:

jobs:
  eval:
    name: tests + golden routing gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Unit tests (no MLX)
        run: pytest -q
      - name: Golden-set routing gate
        run: python scripts/run_ci_eval.py
